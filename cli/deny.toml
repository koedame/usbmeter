# cargo deny check advisories bans sources: advisories (RUSTSEC) against the lockfile, and
# the dependencies that must not get in. The accepted licenses are in about.toml.

[graph]
# the dev-dependencies are only used by the tests and are not in the binary
exclude-dev = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
unmaintained = "workspace"

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The recorder makes no network connections: none of the HTTP clients may get in.
deny = [
  { name = "reqwest" },
  { name = "hyper" },
  { name = "ureq" },
  { name = "isahc" },
  { name = "surf" },
  { name = "attohttpc" },
  { name = "curl" },
  { name = "native-tls" },
  { name = "openssl" },
  { name = "rustls" },
]

[sources]
# only crates.io: a dependency from a git repository or another registry is not reviewed by anyone
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
