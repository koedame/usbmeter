version: 2

# Minor and patch updates come as one pull request a week, major ones one per dependency.
# Security updates are not grouped: each alert gets its own pull request right away.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]
        group-by: dependency-name
