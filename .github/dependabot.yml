version: 2

# Minor and patch updates come as one pull request a week, major ones one per dependency.
# Security updates are not grouped: each alert gets its own pull request right away.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The init and analyze steps of CodeQL must run the same version, so a
      # pull request that bumps only one of them fails the scan.
      codeql-action:
        patterns: ["github/codeql-action/*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]
        group-by: dependency-name
